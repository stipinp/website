<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pablo Rivero — Stipinpixel</title>
<meta name="description" content="Pablo Rivero (Stipinpixel). Artista, curador e investigador. Tucumán, Argentina.">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;900&display=swap" rel="stylesheet">

<style>
/* =========================================================================
   TODO EL DISEÑO ESTÁ ACÁ. La grilla sale de --u.
   ========================================================================= */
:root{
  --u: 25px;                 /* el módulo. cambialo y cambia el sitio entero */
  --content: 1020px;
  --page: 1600px;
  --gap: 25px;

  --bg:   #000000;
  --fg:   #ffffff;
  --blue: #0000a6;           /* azul, se sigue usando en el wordmark y el pie */
  --rest: #000000;           /* color de reposo del nav y de los cuadrados */

  /* color de cada sección — sólo aparece en hover y en la sección activa */
  --c-works:      #00c4c4;
  --c-curatorial: #00c400;
  --c-projects:   #c400c4;
  --c-research:   #c40000;
  --c-info:       #c46a00;
  --c-contact:    #b4b4b4;

  --placeholder: #ff00ff;    /* si ves rosa, falta una imagen */

  --accent: var(--blue);
  --rule:   var(--bg);

  /* la pestañita de arriba del ítem activo */
  --tab-h:   calc(var(--u) / 2);
  --tab-gap: calc(var(--u) / 2);
}

[data-section="home"]       { --accent: var(--blue);         --rule:#000; }
[data-section="works"]      { --accent: var(--c-works); }
[data-section="curatorial"] { --accent: var(--c-curatorial); }
[data-section="projects"]   { --accent: var(--c-projects); }
[data-section="research"]   { --accent: var(--c-research); }
[data-section="info"]       { --accent: var(--c-info); }
[data-section="contact"]    { --accent: var(--c-contact); }

*,*::before,*::after{ box-sizing:border-box; }
html{ background:var(--bg); }
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"Montserrat",system-ui,sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
img{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }
:focus-visible{ outline:3px solid var(--fg); outline-offset:3px; }

/* ---------- HEADER ---------- */
.masthead{
  max-width:var(--page); margin:0 auto;
  padding:var(--u) 50px;
  display:flex; align-items:center; gap:var(--u);
}
.brand{ display:flex; align-items:center; gap:50px; flex:0 0 auto; }
.brand__mark{ width:100px; height:100px; image-rendering:pixelated; }
.brand__name{
  display:flex; flex-direction:column; align-items:flex-end;
  background:var(--blue); padding:0 4px;
  font-weight:900; font-size:24px; line-height:var(--u);
  letter-spacing:-0.01em;
}

.nav{ margin-left:auto; display:flex; align-items:flex-end; gap:50px; }

/* Reposo: bloque azul detrás de la etiqueta, sin pestaña. */
.nav a{
  position:relative;
  display:flex; align-items:flex-end;
  height:var(--u); padding:0 3px;
  background:var(--rest);
  font-weight:600; font-size:18px; line-height:1;
  color:var(--fg); white-space:nowrap;
}
.nav a > span{ transform:translateY(.2em); }

/* La pestañita: bloque separado, medio módulo de alto,
   medio módulo de aire entre ella y la etiqueta. */
.nav a::before{
  content:"";
  position:absolute; left:0; right:0;
  bottom:calc(100% + var(--tab-gap));
  height:var(--tab-h);
  background:transparent;
}

/* Hover y sección activa: el azul se pinta del color y aparece la pestaña. */
.nav a:hover,
.nav a:focus-visible,
.nav a[aria-current="page"]{ background:var(--item); }

.nav a:hover::before,
.nav a:focus-visible::before,
.nav a[aria-current="page"]::before{ background:var(--item); }

/* ---------- CUADRADOS: 4 sociales + idioma ---------- */
.squares{ display:flex; align-items:flex-end; gap:34px; margin-left:50px; }
.squares > *{
  display:flex; align-items:center; justify-content:center;
  width:var(--u); height:var(--u);
  background:var(--rest); color:var(--fg);
  border:0; padding:0; cursor:pointer;
  font-family:inherit; font-weight:600; font-size:13px; line-height:1;
}
/* El PNG se usa como máscara, así el glifo se pinta con CSS y se puede
   recolorear. Requiere PNG transparente: glifo opaco, fondo vacío. */
.squares .ico{
  width:100%; height:100%;
  background:currentColor;
  -webkit-mask:var(--src) center / contain no-repeat;
          mask:var(--src) center / contain no-repeat;
}
.squares > *:hover{ color:var(--c-contact); }

/* ---------- MARCO Y GRILLA ---------- */
.wrap{
  max-width:calc(var(--content) + var(--u) * 2);
  margin:0 auto; position:relative;
  border-left:var(--u) solid var(--rule);
  border-right:var(--u) solid var(--rule);
}
.rule{ height:var(--u); background:var(--rule); }

.band{ display:grid; gap:var(--gap); }
.band--70-30   { grid-template-columns:700fr 295fr; }
.band--30-70   { grid-template-columns:295fr 700fr; }
.band--thirds  { grid-template-columns:1fr 1fr 1fr; }
.band--30-30-40{ grid-template-columns:295fr 295fr 380fr; }

.tile{ position:relative; overflow:hidden; margin:0; background:#000; }
.tile img{ width:100%; height:100%; object-fit:cover; }
.tile--wide { aspect-ratio:700/394; }
.tile--tall { aspect-ratio:295/394; }
.tile--third{ aspect-ratio:393/295; }
.tile--sq   { aspect-ratio:295/393; }
.tile--half { aspect-ratio:380/393; }
.tile--panel{ aspect-ratio:700/393; }
.tile__label{
  position:absolute; left:0; bottom:0;
  background:var(--accent); color:var(--fg);
  font-weight:600; font-size:18px; line-height:var(--u);
  padding:0 8px; transform:translateY(100%);
  transition:transform .12s steps(2);
}
.tile:hover .tile__label,
.tile:focus-within .tile__label{ transform:translateY(0); }

/* ---------- ÍNDICE DE SECCIÓN ---------- */
.entry{
  display:grid; grid-template-columns:1fr 296px; gap:var(--gap);
  align-items:stretch; background:var(--rule);
}
.entry__text{ background:var(--bg); padding-top:var(--u); }
.entry__media{ aspect-ratio:699/394; background:var(--placeholder); overflow:hidden; }
.entry__media img{ width:100%; height:100%; object-fit:cover; }
.entry__title{ margin:0; font-weight:900; font-size:36px; line-height:1.2; letter-spacing:-0.02em; }
.entry__meta{ margin:var(--u) 0 0; text-align:right; font-weight:500; font-size:18px; }
.entry__excerpt{ margin:calc(var(--u)/2) 0 0; text-align:right; font-weight:500; font-size:15px; line-height:1.5; }
.entry:hover .entry__title{ color:var(--accent); }

/* ---------- FICHA DE OBRA ---------- */
.work__title{ margin:0; padding:calc(var(--u)*2) 0 0; text-align:center;
  font-weight:900; font-size:36px; line-height:1.25; letter-spacing:-0.02em; }
.work__year{ margin:calc(var(--u)*2) 0 0; text-align:right; font-weight:500; font-size:18px; }
.work__body{ margin-left:auto; max-width:540px; text-align:right;
  font-weight:500; font-size:15px; line-height:1.6; }
.work__body p{ margin:var(--u) 0 0; }
.work__body a{ text-decoration:underline; }
.work__gallery{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--gap); margin-top:calc(var(--u)*2); }
.work__gallery figure{ margin:0; aspect-ratio:4/3; background:var(--placeholder); overflow:hidden; }
.work__gallery img{ width:100%; height:100%; object-fit:cover; }

/* Flecha de volver: 5 cuadrados de un módulo formando "<" */
.back{
  display:block; position:absolute;
  top:calc(var(--u)*14); right:calc(100% + var(--u)*2);
  width:75px; height:125px; color:var(--accent);
}
.back svg{ display:block; width:100%; height:100%; fill:currentColor; }
.back:hover{ opacity:.6; }

/* ---------- FOOTER ---------- */
.colophon{
  padding:calc(var(--u)*2) 0 calc(var(--u)*3);
  display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*1.5);
}
.colophon .squares{ margin-left:0; }
.colophon__legal{
  background:var(--blue); font-weight:600; font-size:18px;
  line-height:var(--u); padding:0 4px;
}

.section-gap{ height:calc(var(--u)*2); }

/* ---------- RESPONSIVE ---------- */
@media (max-width:1400px){
  .back{ position:static; margin:var(--u) 0 0; }
}
@media (max-width:1200px){
  .masthead{ padding:var(--u); }
  .brand{ gap:var(--u); }
  .nav{ gap:var(--u); }
  .squares{ margin-left:var(--u); gap:var(--u); }
}
@media (max-width:1024px){
  .masthead{ flex-wrap:wrap; }
  .nav{ order:3; width:100%; margin-left:0; justify-content:flex-start; flex-wrap:wrap; row-gap:calc(var(--u)*1.5); }
  .squares{ margin-left:auto; }
  .brand__mark{ width:75px; height:75px; }
}
@media (max-width:768px){
  :root{ --u:20px; }
  .wrap{ border-left-width:0; border-right-width:0; padding:0 var(--u); }
  .band--70-30,.band--30-70,.band--thirds,.band--30-30-40{ grid-template-columns:1fr; }
  .tile--wide,.tile--tall,.tile--third,.tile--sq,.tile--half,.tile--panel{ aspect-ratio:4/3; }
  .entry{ grid-template-columns:1fr; background:transparent; }
  .entry__text{ padding-top:0; }
  .entry__title,.work__title{ font-size:28px; }
  .entry__meta,.entry__excerpt,.work__year,.work__body{ text-align:left; }
  .work__body{ margin-left:0; }
  .work__title{ text-align:left; }
  .work__gallery{ grid-template-columns:1fr 1fr; }
  .nav a{ font-size:15px; }
  .brand__name{ font-size:18px; line-height:20px; }
}
@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; }
  .tile__label{ transform:translateY(0); }
}
</style>
</head>

<body data-section="home">
<div id="app"></div>

<script>
/* ==========================================================================
   1. CONTENIDO — es lo único que hace falta tocar para cargar obra nueva
   ========================================================================== */

const SITE = {
  mark:  "assets/img/favicon.png",
  email: "stipinp@gmail.com",
  legal: "© Pablo Rivero — Stipinpixel",
  /* el cuadradito de idioma muestra el idioma EN EL QUE ESTÁS.
     poné false y muestra al que vas a saltar. */
  langShowsCurrent: true,
  social: [
    { id:"instagram", label:"Instagram", href:"https://instagram.com/stipinp" },
    { id:"linkedin",  label:"LinkedIn",  href:"https://www.linkedin.com/in/pablo-rivero-stipinpixel/" },
    { id:"x",         label:"X",         href:"https://x.com/stipinpixel" },
    { id:"itchio",   label:"itchio",   href:"https://pablorivero.itch.io/" },
  ],
};

/* Cada sección: el orden de este array es el orden del menú. */
const SECTIONS = [
  /* Obra, Curaduría, Proyectos e Investigación todavía no están publicadas.
     Para encender una, pegá acá su objeto (mirá LEEME.md) y aparece sola
     en el menú: el resto del sitio ya sabe dibujar índices y fichas. */
  {
    id:"info", slug:"info", color:"var(--c-info)",
    label:{ es:"Info", en:"About" },
    page:{
      es:`<p>Es artista visual y curador. Trabaja desde el noroeste argentino desplazando imágenes del archivo arqueológico hacia el pixel, el algoritmo y la cerámica. Diseñador de Interiores y Equipamiento por la UNT, cursa el Programa de Actualización en Tecnologías en el Arte Contemporáneo (FFyL, UBA) y la Especialización en Historia del Arte en Tucumán (UNT).Se mueve entre el videojuego,  los  sistemas generativos, GIF art, escultura y arquitectura inflable, y se apoya en una investigación sostenida sobre la iconografía arqueológica de la región. Es fundador y director de Maskay, galería de arte digital. Expuso en Tokyo Node Labs/NEORT, Miyashita Park y Nox Gallery (Tokio), Kulturmuseum Bern, la Biennale ARTour (Bélgica), Cádiz, Montreal y Miami. Como curador realizó, entre otras, Sobre Periferia en el Museo Casa de la Ciudad y ¿Qué está sucediendo en internet? en ARTUC 2026. Recibió el Premio Innovación del Premio Ledesma de Artes Visuales 2025 por el videojuego Ritual de arcilla para llorar y su obra integra la antología TzAR: Pixel Art Anthology.</p>`,
      en:`<p>He is a visual artist and curator. Working from northwest Argentina, he displaces images from the archaeological archive into the pixel, the algorithm and clay. He holds a degree in Interior and Furniture Design from the Universidad Nacional de Tucumán, and is currently enrolled in the Technologies in Contemporary Art program (FFyL, UBA) and the Specialisation in Art History in Tucumán (UNT). He moves between video games, generative systems, GIF art, sculpture and inflatable architecture, grounded in sustained research into the archaeological iconography of the region. He is the founder and director of Maskay, a digital art gallery. He has exhibited at Tokyo Node Labs/NEORT, Miyashita Park and Nox Gallery (Tokyo), Kulturmuseum Bern, the ARTour Biennale (Belgium), Cádiz, Montreal and Miami. His curatorial projects include Sobre Periferia at Museo Casa de la Ciudad and ¿Qué está sucediendo en internet? at ARTUC 2026. He received the Innovation Award at the 2025 Premio Ledesma de Artes Visuales for the video game Ritual de arcilla para llorar, and his work is included in the anthology TzAR: Pixel Art Anthology.</p>`,
    },
  },
  {
    id:"contact", slug:"contact", color:"var(--c-contact)",
    label:{ es:"Contacto", en:"Contact" },
    page:{
      es:`<p><a href="mailto:stipinp@gmail.com">stipinp@gmail.com</a></p>
          
          <p>San Miguel de Tucumán, Argentina</p>`,
      en:`<p><a href="mailto:stipinp@gmail.com">stipinp@gmail.com</a></p>
          
          <p>San Miguel de Tucumán, Argentina</p>`,
    },
  },
];

/* La grilla del home. layout: 70-30 · thirds · 30-30-40 · 30-70 */
const HOME = [
  { layout:"70-30", tiles:[
    { size:"wide", img:"assets/img/home/01.JPEG",
      title:{  es:"Ritual de arcilla para llorar", en:"Crying clay ritual" } },
    { size:"tall", img:"assets/img/home/02.JPEG",
      title:{ es:"Cerámica", en:"Clay" } },
  ]},
  { layout:"thirds", tiles:[
    { size:"third", img:"assets/img/home/03.jpg", title:{ es:"La Danza de las Piedras (RUMI RAYMI)", en:"The Stone Dance (RUMI RAYMI)" } },
    { size:"third", img:"assets/img/home/04.jpg", title:{ es:"La Danza de las Piedras (RUMI RAYMI)", en:"The Stone Dance (RUMI RAYMI)" } },
    { size:"third", img:"assets/img/home/05.jpg",
      title:{ es:"Acuarela", en:"Watercolor" } },
  ]},
  { layout:"30-30-40", tiles:[
    { size:"sq",   img:"assets/img/home/06.JPEG", title:{ es:"ARCILLA", en:"MUD" } },
    { size:"sq",   img:"assets/img/home/07.JPEG", title:{ es:"PUKA RIKUY", en:"PUKA RIKUY" } },
    { size:"half", img:"assets/img/home/08.jpg", title:{ es:"¿Qué está sucediendo en internet? en ARTUC 2026", en:" What´s Happening on the internet? in ARTUC 2026" } },
  ]},
  { layout:"30-70", tiles:[
    { size:"sq",    img:"assets/img/home/09.JPEG", title:{ es:"Cerámica 2014/2015", en:"Clay 2014/2015" } },
    { size:"panel", img:"assets/img/home/10.gif", title:{ es:"Danza y magia... junto al dos caras...", en:"Dance and magic... beside the Two-Faced One..." } },
  ]},
];

const STRINGS = {
  back:      { es:"Volver", en:"Back" },
  notFound:  { es:"No encontramos esa página.", en:"That page doesn't exist." },
  goHome:    { es:"Ir al inicio", en:"Go to the home page" },
  metaHome:  { es:"Pablo Rivero (Stipinpixel). Artista, curador e investigador. Tucumán, Argentina.",
               en:"Pablo Rivero (Stipinpixel). Artist, curator and researcher. Tucumán, Argentina." },
};

/* ==========================================================================
   2. ICONOS — PNG de 25×25 en assets/img/icons/
   ========================================================================== */
const ICONS = {
  instagram: "assets/img/icons/instagram.png",
  linkedin:  "assets/img/icons/linkedin.png",
  x:         "assets/img/icons/x.png",
  itchio:    "assets/img/icons/itch.png",
};

function icon(name){
  return `<span class="ico" style="--src:url('${ICONS[name]}')"></span>`;
}

/* ==========================================================================
   3. ESTADO Y RUTEO
   ========================================================================== */
const app  = document.getElementById("app");

let lang = localStorage.getItem("lang")
        || ((navigator.language || "es").startsWith("en") ? "en" : "es");

const t     = v => (v && typeof v === "object") ? (v[lang] ?? v.es) : v;
const esc   = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const find  = slug => SECTIONS.find(s => s.slug === slug);

/* Ruteo por hash: la parte de la URL antes del # nunca cambia, así que el
   sitio funciona igual en la raíz de un dominio, en usuario.github.io/repo/
   y abriendo el archivo con doble clic. Las rutas relativas nunca se rompen. */
function path(){
  return location.hash.replace(/^#/, "") || "/";
}
function go(to){
  if (to === path()) { render(); } else { location.hash = to; }
  window.scrollTo(0,0);
}

document.addEventListener("click", e => {
  const a = e.target.closest("a[data-to]");
  if (!a) return;
  e.preventDefault();
  go(a.dataset.to);
});
window.addEventListener("hashchange", render);

function setLang(next){
  lang = next;
  localStorage.setItem("lang", lang);
  document.documentElement.lang = lang;
  render();
}

/* ==========================================================================
   4. PIEZAS DE INTERFAZ
   ========================================================================== */

function squares(){
  const social = SITE.social.map(s =>
    `<a href="${s.href}" target="_blank" rel="me noopener" aria-label="${s.label}">${icon(s.id)}</a>`
  ).join("");
  const shown = SITE.langShowsCurrent ? lang : (lang === "es" ? "en" : "es");
  const label = lang === "es" ? "Switch to English" : "Cambiar a español";
  return `<div class="squares">${social}
    <button type="button" data-lang aria-label="${label}" title="${label}">${shown}</button>
  </div>`;
}

function header(active){
  const items = SECTIONS.map(s => {
    const cur = s.id === active ? ' aria-current="page"' : "";
    return `<a href="#/${s.slug}" data-to="/${s.slug}" style="--item:${s.color}"${cur}><span>${esc(t(s.label))}</span></a>`;
  }).join("");
  return `<header class="masthead">
    <a class="brand" href="#/" data-to="/">
      <img class="brand__mark" src="${SITE.mark}" alt="Pablo Rivero — Stipinpixel">
      <span class="brand__name"><span>pablo rivero</span><span>stipinpixel</span></span>
    </a>
    <nav class="nav" aria-label="${lang==="es"?"Secciones":"Sections"}">${items}</nav>
    ${squares()}
  </header>`;
}

function footer(){
  return `<footer class="colophon">${squares()}
    <p class="colophon__legal">${esc(SITE.legal)}</p>
  </footer>`;
}

function back(to){
  return `<a class="back" href="#${to}" data-to="${to}" aria-label="${esc(t(STRINGS.back))}">
    <svg viewBox="0 0 3 5" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" shape-rendering="crispEdges">
      <rect x="2" y="0" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/>
      <rect x="0" y="2" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/>
      <rect x="2" y="4" width="1" height="1"/>
    </svg></a>`;
}

/* ==========================================================================
   5. VISTAS
   ========================================================================== */

function viewHome(){
  const bands = HOME.map(b => `
    <div class="rule"></div>
    <div class="band band--${b.layout}">
      ${b.tiles.map(x => `
        <figure class="tile tile--${x.size}">
          <img src="${x.img}" alt="${esc(t(x.title))}" loading="lazy" decoding="async">
          <figcaption class="tile__label">${esc(t(x.title))}</figcaption>
        </figure>`).join("")}
    </div>`).join("");
  return { section:"home", title:"Pablo Rivero — Stipinpixel", desc:t(STRINGS.metaHome),
    html:`<main class="wrap">${bands}<div class="rule"></div></main>` };
}

function viewSection(sec){
  const label = t(sec.label);

  if (sec.page){
    return { section:sec.id, title:`${label} — Pablo Rivero`, desc:label,
      html:`<main class="wrap">
        <div class="rule"></div>
        <h1 class="work__title">${esc(label)}</h1>
        <div class="work__body">${t(sec.page)}</div>
        <div class="section-gap"></div><div class="rule"></div>
      </main>` };
  }

  const rows = sec.items.map(it => `
    <div class="rule"></div>
    <article class="entry">
      <a class="entry__media" href="#/${sec.slug}/${it.slug}" data-to="/${sec.slug}/${it.slug}">
        <img src="${it.cover}" alt="${esc(t(it.title))}">
      </a>
      <div class="entry__text">
        <h2 class="entry__title">
          <a href="#/${sec.slug}/${it.slug}" data-to="/${sec.slug}/${it.slug}">${esc(t(it.title))}</a>
        </h2>
        <p class="entry__meta">${esc(it.year)}</p>
        <p class="entry__excerpt">${esc(t(it.excerpt))}</p>
      </div>
    </article>`).join("");

  return { section:sec.id, title:`${label} — Pablo Rivero`, desc:label,
    html:`<main class="wrap">${rows}<div class="rule"></div></main>` };
}

function viewItem(sec, it){
  const gallery = it.gallery.length
    ? `<div class="work__gallery">${it.gallery.map(g =>
        `<figure><img src="${g}" alt=""></figure>`).join("")}</div>`
    : "";
  return { section:sec.id, title:`${t(it.title)} — Pablo Rivero`, desc:t(it.excerpt),
    html:`<main class="wrap">
      ${back("/" + sec.slug)}
      <h1 class="work__title">${esc(t(it.title))}</h1>
      <p class="work__year">${esc(it.year)}</p>
      <div class="work__body">${t(it.body).map(p => `<p>${esc(p)}</p>`).join("")}</div>
      ${gallery}
      <div class="section-gap"></div><div class="rule"></div>
    </main>` };
}

function viewMissing(){
  return { section:"home", title:"404 — Pablo Rivero", desc:"",
    html:`<main class="wrap">
      <div class="rule"></div>
      <h1 class="work__title">404</h1>
      <div class="work__body">
        <p>${esc(t(STRINGS.notFound))}</p>
        <p><a href="#/" data-to="/">${esc(t(STRINGS.goHome))}</a></p>
      </div>
      <div class="section-gap"></div><div class="rule"></div>
    </main>` };
}

function resolve(){
  const parts = path().split("/").filter(Boolean);
  if (!parts.length) return viewHome();
  const sec = find(parts[0]);
  if (!sec) return viewMissing();
  if (parts.length === 1) return viewSection(sec);
  const it = (sec.items || []).find(i => i.slug === parts[1]);
  return it ? viewItem(sec, it) : viewMissing();
}

function render(){
  const v = resolve();
  document.body.dataset.section = v.section;
  document.documentElement.lang = lang;
  document.title = v.title;
  const m = document.querySelector('meta[name="description"]');
  if (m) m.setAttribute("content", v.desc || "");
  app.innerHTML = header(v.section) + v.html + footer();
  app.querySelectorAll("[data-lang]").forEach(b =>
    b.addEventListener("click", () => setLang(lang === "es" ? "en" : "es")));
}

render();
</script>
</body>
</html>
