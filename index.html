<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pablo Rivero - Stipinpixel</title>
<meta name="description" content="Pablo Rivero (Stipinpixel). Artista visual, curador e investigador. Tucumán, Argentina.">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;900&display=swap" rel="stylesheet">

<style>
/* =========================================================================
   DISEÑO. Todo sale del módulo --u (25 px).
   ========================================================================= */
:root{
  --u: 25px;
  --content: 1020px;
  --page: 1600px;

  --bg:   #000000;
  --fg:   #ffffff;
  --blue: #0000a6;           /* reposo del menú, cuadrados y pie */
  --line: #262626;           /* líneas finas de listas */
  --muted:#c8c8c8;

  /* un color por sección */
  --c-works:      #00c4c4;
  --c-curatorial: #00c400;
  --c-projects:   #c400c4;
  --c-research:   #c40000;
  --c-info:       #c46a00;
  --c-contact:    #b4b4b4;

   --placeholder: #000000;

  --accent: var(--blue);
  --accent-text: #ffffff;    /* texto legible del color de sección sobre negro */

  --tab-h:   calc(var(--u) / 2);
  --tab-gap: calc(var(--u) / 2);
}
[data-section="works"]      { --accent: var(--c-works);      --accent-text:#00c4c4; }
[data-section="curatorial"] { --accent: var(--c-curatorial); --accent-text:#00c400; }
[data-section="projects"]   { --accent: var(--c-projects);   --accent-text:#ff7dff; }
[data-section="research"]   { --accent: var(--c-research);   --accent-text:#ff6b6b; }
[data-section="info"]       { --accent: var(--c-info);       --accent-text:#ffa64d; }
[data-section="contact"]    { --accent: var(--c-contact);    --accent-text:#b4b4b4; }

*,*::before,*::after{ box-sizing:border-box; }
html{ background:var(--bg); }
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"Montserrat",system-ui,sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
img{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }
p{ margin:0; }
:focus-visible{ outline:3px solid var(--fg); outline-offset:3px; }

/* ---------- HEADER ---------- */
.masthead{
  max-width:var(--page); margin:0 auto; padding:var(--u) 50px;
  display:flex; align-items:center; gap:var(--u);
}
.brand{ display:flex; align-items:center; gap:50px; flex:0 0 auto; }
.brand__mark{ width:100px; height:100px; image-rendering:pixelated; }
.brand__name{
  display:flex; flex-direction:column; align-items:flex-end;
  background:var(--blue); padding:0 4px;
  font-weight:900; font-size:24px; line-height:var(--u); letter-spacing:-0.01em;
}
.nav{ margin-left:auto; display:flex; align-items:flex-end; gap:50px; }
.nav a{
  position:relative; display:flex; align-items:flex-end;
  height:var(--u); padding:0 3px; background:var(--blue);
  font-weight:600; font-size:18px; line-height:1; white-space:nowrap;
}
.nav a > span{ transform:translateY(.2em); }
.nav a::before{
  content:""; position:absolute; left:0; right:0;
  bottom:calc(100% + var(--tab-gap)); height:var(--tab-h); background:transparent;
}
.nav a:hover, .nav a:focus-visible, .nav a[aria-current="page"]{ background:var(--item); }
.nav a:hover::before, .nav a:focus-visible::before, .nav a[aria-current="page"]::before{ background:var(--item); }

.squares{ display:flex; align-items:flex-end; gap:34px; margin-left:50px; }
.squares > *{
  display:flex; align-items:center; justify-content:center;
  width:var(--u); height:var(--u); background:var(--blue); color:var(--fg);
  border:0; padding:0; cursor:pointer;
  font-family:inherit; font-weight:600; font-size:13px; line-height:1;
}
.squares img{ width:100%; height:100%; image-rendering:pixelated; }
.squares > *:hover{ background:var(--accent); }

/* ---------- MARCO ---------- */
.wrap{ max-width:var(--content); margin:0 auto; }
.gap{ height:var(--u); }
.gap2{ height:calc(var(--u) * 2); }

/* ---------- IMÁGENES ---------- */
.m{ position:relative; overflow:hidden; background:#000; margin:0; }
.m.missing{ background:var(--placeholder); }
.m img{ opacity:0; transition:opacity .3s; }
.m.ok img{ opacity:1; }
.m img{ width:100%; height:100%; object-fit:cover; }
.m--free.ok{ aspect-ratio:auto !important; background:none; }
.m--free.ok img{ height:auto; object-fit:initial; }
.cap{
  display:flex; gap:10px; align-items:baseline; margin:12.5px 0 0;
  font-weight:500; font-size:13px; line-height:1.45; color:#e6e6e6;
}
.cap::before{ content:""; flex:0 0 12.5px; height:12.5px; background:var(--accent); transform:translateY(1px); }

/* ---------- HOME ---------- */
.band{ display:grid; gap:var(--u); }
.band--70-30   { grid-template-columns:700fr 295fr; }
.band--30-70   { grid-template-columns:295fr 700fr; }
.band--thirds  { grid-template-columns:1fr 1fr 1fr; }
.band--30-30-40{ grid-template-columns:295fr 295fr 380fr; }
.tile{ position:relative; overflow:hidden; display:block; }
.tile--wide { aspect-ratio:700/394; } .tile--tall { aspect-ratio:295/394; }
.tile--third{ aspect-ratio:393/295; } .tile--sq   { aspect-ratio:295/393; }
.tile--half { aspect-ratio:380/393; } .tile--panel{ aspect-ratio:700/393; }
.tile .m{ width:100%; height:100%; }
.tile__label{
  position:absolute; left:0; bottom:0;
  background:var(--blue); color:var(--fg);
  font-weight:600; font-size:18px; line-height:var(--u);
  padding:0 8px; transform:translateY(100%);
  transition:transform .12s steps(2);
}
.tile:hover .tile__label, .tile:focus-visible .tile__label{ transform:translateY(0); }

/* ---------- BARRA DE SUBSECCIONES ---------- */
.bar{ display:flex; flex-wrap:wrap; gap:12.5px; align-items:center; padding:var(--u) 0; }
.bar__back{
  display:inline-flex; align-items:center; height:37.5px; padding:0 12.5px;
  background:var(--blue); font-weight:600; font-size:15px;
}
.bar__back:hover{ background:var(--accent); color:#000; }
.chip{
  display:inline-flex; align-items:center; height:37.5px; padding:0 12.5px;
  border:2px solid var(--accent); font-weight:600; font-size:15px;
}
.chip:hover{ background:#151515; }
.chip[aria-current="page"]{ background:var(--accent); color:#000; }

/* ---------- TÍTULOS Y TEXTO ---------- */
.lead{ display:grid; grid-template-columns:295fr 700fr; gap:var(--u); padding:var(--u) 0 50px; }
.h1{ margin:0; font-weight:900; font-size:40px; line-height:1.1; letter-spacing:-0.02em; }
.h1--xl{ font-size:48px; line-height:1.05; }
.h2{ margin:0; font-weight:900; font-size:24px; line-height:1.2; }
.kick{ font-weight:600; font-size:13px; color:var(--accent-text); }
.prose p{ font-weight:500; font-size:17px; line-height:1.65; max-width:640px; }
.prose p + p{ margin-top:20px; }
.prose a{ text-decoration:underline; text-underline-offset:3px; }
.link{ font-weight:600; font-size:14px; border-bottom:2px solid var(--accent); }
.link:hover{ color:var(--accent-text); }

/* ---------- OBRA: ANTESALA ---------- */
.lines{ display:grid; gap:50px var(--u); padding:var(--u) 0 50px; }
.lines + .lines{ padding-top:0; }
.line{ display:flex; flex-direction:column; gap:14px; }
.line__t{ margin:0; font-weight:900; font-size:26px; line-height:1.15; }
.line:hover .line__t{ color:var(--accent-text); }

/* ---------- TARJETAS ---------- */
.cards{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:50px var(--u); padding-bottom:50px; }
.card{ display:flex; flex-direction:column; }
.card__b{ padding-top:14px; display:flex; flex-direction:column; gap:5px; }
.card__y{ font-weight:600; font-size:13px; color:var(--accent-text); }
.card__t{ margin:0; font-weight:900; font-size:20px; line-height:1.2; }
.card__d{ font-weight:500; font-size:14px; line-height:1.45; }
.card:hover .card__t{ color:var(--accent-text); }

/* ---------- FICHA ---------- */
.ftitle{ display:flex; justify-content:space-between; align-items:flex-end; gap:var(--u); padding:var(--u) 0; }
.ftitle__y{ font-weight:600; font-size:20px; color:var(--accent-text); white-space:nowrap; }
.fhead{ display:grid; grid-template-columns:600fr 345fr; gap:50px; padding:50px 0; }
.sheet{ margin:0; display:grid; grid-template-columns:110px minmax(0,1fr); border-top:3px solid var(--accent); align-self:start; }
.sheet dt{ padding:12px 0; font-weight:600; font-size:13px; color:var(--accent-text); border-bottom:1px solid var(--line); }
.sheet dd{ margin:0; padding:12px 0 12px 12px; font-weight:500; font-size:14px; line-height:1.45; border-bottom:1px solid var(--line); }
.sheet dd ul{ margin:0; padding-left:16px; }
.sheet dd li + li{ margin-top:6px; }
.gal{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:50px var(--u); padding-bottom:50px; }
.bul{ margin:14px 0 0; padding-left:20px; font-weight:500; font-size:16px; line-height:1.6; }

/* ---------- CURADURÍA ---------- */
.show{ display:grid; grid-template-columns:700fr 295fr; gap:var(--u); }
.show + .show{ margin-top:50px; }
.show__side{ display:flex; flex-direction:column; gap:12px; padding:0 0 0 12.5px; }
.show__t{ margin:0; font-weight:900; font-size:28px; line-height:1.1; }
.show__t a:hover{ color:var(--accent-text); }
.show__r{ font-weight:500; font-size:14px; line-height:1.45; }
.quote{ margin:12px 0 0; padding-left:12.5px; border-left:3px solid var(--accent); font-weight:500; font-style:italic; font-size:15px; line-height:1.55; }
.btn{ display:inline-flex; align-items:center; align-self:flex-start; background:var(--accent); color:#000; font-weight:600; font-size:14px; padding:8px 12px; }
.btn:hover{ background:#fff; }
.show__side .btn{ margin-top:auto; }
.rows{ list-style:none; margin:0; padding:0; }
.rows li{ display:grid; grid-template-columns:80px minmax(0,1fr) 300px; gap:var(--u); padding:14px 0; border-bottom:1px solid var(--line); align-items:baseline; }
.rows b{ font-weight:600; font-size:14px; color:var(--accent-text); }
.rows .t{ font-weight:900; font-size:17px; }
.rows a.t:hover{ color:var(--accent-text); }
.rows .v{ font-weight:500; font-size:13px; color:var(--muted); text-align:right; }
.text p{ font-weight:500; font-size:18px; line-height:1.75; max-width:680px; }
.text p + p{ margin-top:22px; }
.text--poem p{ font-size:24px; font-style:italic; line-height:1.6; }

/* ---------- PROYECTOS ---------- */
.prjs{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:50px var(--u); padding:var(--u) 0 50px; }
.prj{ display:flex; flex-direction:column; gap:14px; }
.prj__t{ margin:0; font-weight:900; font-size:32px; line-height:1.1; }
.prj:hover .prj__t{ color:var(--accent-text); }
.phero{ display:grid; grid-template-columns:345fr 600fr; gap:50px; padding:var(--u) 0 50px; }
.phero__t{ margin:0; font-weight:900; font-size:56px; line-height:1; }
.phero .kick{ margin-top:12px; font-size:15px; }
.note{ padding:12px 14px; border:2px solid var(--accent); font-size:14px !important; }
.hl{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:50px var(--u); padding:var(--u) 0 50px; }
.cap b{ font-weight:900; color:#fff; }
.yr{ display:grid; grid-template-columns:125px minmax(0,1fr); border-top:2px solid var(--line); }
.yr__y{ margin:0; padding:14px 0; font-weight:900; font-size:22px; color:var(--accent-text); }
.ev{ list-style:none; margin:0; padding:0 0 12px; }
.ev li{ display:grid; grid-template-columns:110px minmax(0,1fr); gap:18px; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px; line-height:1.5; }
.ev .d{ font-weight:600; color:var(--accent-text); }
.ev b{ font-weight:900; }
.ev--flat li{ grid-template-columns:minmax(0,1fr); }
.toggle{ margin:12px 0 var(--u); background:transparent; border:2px solid var(--accent); color:#fff; font:600 14px "Montserrat",sans-serif; padding:10px 14px; cursor:pointer; }
.toggle:hover{ background:var(--accent); color:#000; }
.block{ padding:50px 0 0; }
.block .h2{ margin-bottom:var(--u); }

/* ---------- INVESTIGACIÓN ---------- */
.rtop{ display:grid; grid-template-columns:295fr 700fr; gap:var(--u); padding:var(--u) 0 50px; }
.entry{ display:grid; grid-template-columns:600fr 345fr; gap:50px; padding:0 0 50px; }
.entry__t{ margin:6px 0 14px; font-weight:900; font-size:24px; line-height:1.2; }
.entry .prose p{ font-size:15px; }
.duo{ display:grid; grid-template-columns:1fr 1fr; gap:var(--u); }

/* ---------- INFO ---------- */
.bio{ display:grid; grid-template-columns:620fr 325fr; gap:50px; padding:var(--u) 0 50px; }
.bio .h1{ margin-bottom:var(--u); }
.cv{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:50px; padding:50px 0; }
.cv .h2{ font-size:20px; padding-bottom:10px; border-bottom:3px solid var(--accent); }
.cvl{ list-style:none; margin:0; padding:0; }
.cvl li{ display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; padding:9px 0; border-bottom:1px solid var(--line); font-weight:500; font-size:14px; line-height:1.45; }
.cvl b{ font-weight:600; color:var(--accent-text); }
.contact{ display:grid; grid-template-columns:295fr 700fr; gap:var(--u); padding:50px 0; scroll-margin-top:var(--u); }
.mail{ align-self:flex-start; font-weight:900; font-size:36px; line-height:1.1; border-bottom:4px solid var(--c-contact); }
.mail:hover{ color:var(--c-contact); }
.contact p{ margin-top:14px; font-weight:500; }
.social{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:12.5px 25px; font-size:16px; }

/* ---------- 404 ---------- */
.err{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:var(--u); padding:50px 0 75px; }
.err__yukk{ width:240px; height:360px; image-rendering:pixelated; }
.err__n{ margin:0; font-weight:900; font-size:120px; line-height:.9; letter-spacing:-0.04em; }
.err__tag{ background:var(--blue); font-weight:600; font-size:18px; line-height:var(--u); padding:0 6px; }
.err__msg{ font-weight:500; font-size:17px; max-width:420px; }
.err .btn{ align-self:center; background:var(--blue); color:#fff; }
.err .btn:hover{ background:#fff; color:#000; }

/* ---------- FOOTER ---------- */
.colophon{ padding:50px 0 75px; display:flex; flex-direction:column; align-items:center; gap:37px; }
.colophon .squares{ margin-left:0; }
.colophon__legal{ background:var(--blue); font-weight:600; font-size:18px; line-height:var(--u); padding:0 4px; }

/* ---------- RESPONSIVE ---------- */
@media (max-width:1200px){
  .masthead{ padding:var(--u); }
  .brand{ gap:var(--u); }
  .nav{ gap:var(--u); }
  .squares{ margin-left:var(--u); gap:var(--u); }
}
@media (max-width:1070px){
  .wrap{ padding:0 var(--u); }
}
@media (max-width:1024px){
  .masthead{ flex-wrap:wrap; }
  .nav{ order:3; width:100%; margin-left:0; flex-wrap:wrap; row-gap:calc(var(--u)*1.5); }
  .squares{ margin-left:auto; }
  .brand__mark{ width:75px; height:75px; }
}
@media (max-width:768px){
  :root{ --u:20px; }
  .wrap{ padding:0 var(--u); }
  .band, .lines, .cards, .gal, .lead, .fhead, .show, .rows li, .prjs, .phero, .hl,
  .rtop, .entry, .bio, .cv, .contact{ grid-template-columns:1fr !important; }
  .tile{ aspect-ratio:auto !important; }
  .tile .m{ aspect-ratio:4/3; height:auto; }
  .tile__label{ position:static; display:inline-block; transform:none; font-size:15px; }
  .rows .v{ text-align:left; }
  .yr, .ev li{ grid-template-columns:1fr; gap:4px; }
  .ftitle{ flex-direction:column; align-items:flex-start; }
  .h1, .h1--xl{ font-size:30px; }
  .phero__t{ font-size:40px; }
  .mail{ font-size:24px; }
  .show__side{ padding:0; }
  .nav{ gap:16px; }
  .nav a{ font-size:15px; }
  .brand__name{ font-size:18px; line-height:20px; }
  .err__n{ font-size:80px; }
}
@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; }
}
</style>
</head>

<body data-section="home">
<div id="app"></div>

<script>
/* ==========================================================================
   1. CONTENIDO. Es lo único que hace falta tocar para cargar obra.
      Cada texto va en { es:"…", en:"…" }. Las imágenes siguen una
      convención de carpetas (ver LEEME.md): si una falta, se ve rosa.
   ========================================================================== */

const SITE = {
  mark:  "assets/img/favicon.png",
  email: "stipinp@gmail.com",
  legal: "© Pablo Rivero - Stipinpixel",
  cv:    { es:"assets/cv-pablo-rivero-es.pdf", en:"assets/cv-pablo-rivero-en.pdf" },
  /* el cuadradito de idioma muestra el idioma EN EL QUE ESTÁS.
     poné false y muestra al que vas a saltar. */
  langShowsCurrent: false,
  social: [
    { id:"instagram", label:"Instagram", href:"https://instagram.com/stipinp" },
    { id:"linkedin",  label:"LinkedIn",  href:"https://www.linkedin.com/in/pablo-rivero-stipinpixel/" },
    { id:"x",         label:"X",         href:"https://x.com/stipinpixel" },
    { id:"itchio",    label:"itch.io",   href:"https://pablorivero.itch.io/" },
  ],
};

/* El menú. El orden de este array es el orden del menú. */
const NAV = [
  { id:"works",      route:"obra",          color:"var(--c-works)",      label:{ es:"Obra",          en:"Works" } },
  { id:"curatorial", route:"curaduria",     color:"var(--c-curatorial)", label:{ es:"Curaduría",     en:"Curatorship" } },
  { id:"projects",   route:"proyectos",     color:"var(--c-projects)",   label:{ es:"Proyectos",     en:"Projects" } },
  { id:"research",   route:"investigacion", color:"var(--c-research)",   label:{ es:"Investigación", en:"Research" } },
  { id:"info",       route:"info",          color:"var(--c-info)",       label:{ es:"Info",          en:"About" } },
  { id:"contact",    route:"contacto",      color:"var(--c-contact)",    label:{ es:"Contacto",      en:"Contact" } },
];

/* --------------------------------------------------------------------------
   HOME. layout: 70-30 · thirds · 30-30-40 · 30-70
   "to" es adónde lleva el click (una ruta del sitio, sin el #).
   -------------------------------------------------------------------------- */
const HOME = [
  { layout:"70-30", tiles:[
    { size:"panel", img:"assets/img/home/10.JPEG", to:"obra/suridimension/ritual-de-arcilla-para-llorar",
      title:{ es:"Ritual de arcilla para llorar", en:"Crying Clay Ritual" } },
    { size:"tall", img:"assets/img/home/02.JPEG", to:"obra/instalaciones",
      title:{ es:"Cerámica", en:"Clay" } },
  ]},
  { layout:"thirds", tiles:[
    { size:"third", img:"assets/img/home/03.jpg", to:"obra/suridimension/rumi-raymi",
      title:{ es:"La Danza de las Piedras (RUMI RAYMI)", en:"The Stone Dance (RUMI RAYMI)" } },
    { size:"third", img:"assets/img/home/04.jpg", to:"obra/suridimension/rumi-raymi",
      title:{ es:"La Danza de las Piedras (RUMI RAYMI)", en:"The Stone Dance (RUMI RAYMI)" } },
    { size:"third", img:"assets/img/home/05.jpg", to:"obra",
      title:{ es:"Acuarela", en:"Watercolor" } },
  ]},
  { layout:"30-30-40", tiles:[
    { size:"sq",   img:"assets/img/home/06.JPEG", to:"obra/instalaciones",
      title:{ es:"Arcilla", en:"Clay" } },
    { size:"sq",   img:"assets/img/home/07.JPEG", to:"obra/instalaciones/puka-rikuy",
      title:{ es:"Puka Rikuy", en:"Puka Rikuy" } },
    { size:"half", img:"assets/img/home/08.jpg", to:"curaduria/que-esta-sucediendo-en-internet",
      title:{ es:"¿Qué está sucediendo en internet? en ARTUC 2026", en:"What Is Happening on the Internet? at ARTUC 2026" } },
  ]},
  { layout:"30-70", tiles:[
    { size:"sq",    img:"assets/img/home/09.JPEG", to:"obra/instalaciones",
      title:{ es:"Cerámica 2014/2015", en:"Clay 2014/2015" } },
    { size:"wide", img:"assets/img/home/01.gif", to:"obra/suridimension",
      title:{ es:"Danza y magia... junto al dos caras...", en:"Dance and magic... beside the Two-Faced One..." } },
      
  ]},
];

/* --------------------------------------------------------------------------
   OBRA. Cinco líneas. La portada de cada línea va en
   assets/img/obra/<línea>/portada.jpg
   -------------------------------------------------------------------------- */
const LINES = [
  { slug:"suridimension",
    title:{ es:"Suri Dimension", en:"Suri Dimension" },
    intro:{ es:"Universo creativo que trabaja con la iconografía y la arqueología del Noroeste Argentino a través del pixel art, el videojuego y la animación. A partir de calcos, relevamientos y piezas arqueológicas de culturas de la región, como Santamariana, Aguada, Candelaria, Tafí y San Francisco…",
            en:"A creative universe that works with the iconography and archaeology of Northwest Argentina through pixel art, video games and animation. Drawing on archaeological tracings, surveys and artifacts from cultures of the region, such as Santamariana, Aguada, Candelaria, Tafí and San Francisco…" } },

      text:{
        es:["La simultaneidad siempre existió, pero con la aparición de internet se desliza en dos capas de realidad, una donde transcurren el calor y las lluvias intensas, y otra donde, conectados a la red, posteamos, scrolleamos, navegamos. Existe la sensación de que las correspondencias temporales no son la misma en cada capa, como si los procesos de información digital estuvieran ligados tanto a la cantidad de personas que la reciben como a la velocidad con que esa información circula.",
            "Mientras intentamos sacar el agua de nuestras casas, que acaba de irrumpir por nuestra puerta de manera inesperada, ya circulan cientos de reels sobre esa inundación, comentados, compartidos, likeados. Esta tensión también atraviesa el arte contemporáneo y en particular, el arte digital, y habilita pensar si internet nos propone nuevas lógicas de acción o si, por el contrario, trasladamos a la red nuestras propias lógicas.",
            "En la manera en que la imagen es transportada, se configura como algo que circula, que no permanece fijo. ¿Dónde se carga esa imagen? Quien lleva una bolsa con una imagen impresa convierte ese objeto en un dispositivo de circulación: transporta, contiene, envuelve, se deforma, se usa, se habita.",
            "¿Quién carga esa imagen? ¿Quién la acarrea? ¿Cuál es la infraestructura que la sostiene? ¿Es la persona o el andamio que sostiene a los albañiles en una obra? El andamio deja ver el sostén, expone la construcción mientras ocurre. La imagen al pasar del andamio al hombro, a la mano, sigue sostenida desplazándose de un sistema a otro, entrando en circulación y recorriendo el espacio que habitamos.",
            "En ese movimiento pasa de mano en mano, de cuerpo en cuerpo, se propaga. Como el agua que atraviesa nuestras piernas, no se observa a distancia, se atraviesa, circula. La imagen sucede."],
        en:["Simultaneity has always existed, but with the arrival of the internet it slides into two layers of reality: one where the heat and the heavy rains go on, and another where, connected to the network, we post, scroll and browse. There is a feeling that time does not correspond in the same way in each layer, as if the processes of digital information were tied both to the number of people who receive it and to the speed at which that information circulates.",
            "While we try to get the water out of our homes, after it unexpectedly burst through our front door, hundreds of reels about that flood are already circulating, commented on, shared, liked. This tension also runs through contemporary art, and digital art in particular, and it opens up the question of whether the internet offers us new logics of action or whether, on the contrary, we carry our own logics into the network.",
            "In the way the image is carried, it takes shape as something that circulates, that does not stay fixed. Where is that image loaded? Whoever carries a bag with a printed image turns that object into a device of circulation: it transports, contains, wraps, deforms, is used, is inhabited.",
            "Who carries that image? Who hauls it? What infrastructure holds it up? Is it the person, or the scaffolding that supports the builders on a construction site? Scaffolding lets the support be seen; it exposes the construction while it happens. As the image passes from the scaffolding to the shoulder, to the hand, it stays held up, moving from one system to another, entering circulation and travelling through the space we inhabit.",
            "In that movement it passes from hand to hand, from body to body, it spreads. Like the water running past our legs, it is not observed from a distance; it is crossed, it circulates. The image happens."] } },

    { slug:"impact", year:"2024", featured:true,
      title:{ es:"IMPACT", en:"IMPACT" },
      date:{ es:"Diciembre 2024", en:"December 2024" },
      place:{ es:"Listening Party Drop Collective Vol. 10, Dune Park, Buenos Aires", en:"Listening Party Drop Collective Vol. 10, Dune Park, Buenos Aires" },
      role:{ es:"MASKAY × Música W3 · Curaduría de videoarte y texto curatorial", en:"MASKAY × Música W3 · Video art curation and curatorial text" },
      desc:{ es:"Drop colectivo de 11 videoclips nacidos de colaboraciones entre artistas sonoros y visuales que trabajaron desde el anonimato mutuo.",
             en:"Collective drop of 11 video clips born from collaborations between sound and visual artists who worked in mutual anonymity." },
      quote:{ es:"Cuando la digitalidad colisiona con la roca, la tierra y el territorio, emergen naturalezas y reglas distintas.",
              en:"When digitality collides with rock, earth and territory, different natures and rules emerge." },
      text:{
        es:["Cuando la digitalidad colisiona con la roca, la tierra y el territorio, emergen naturalezas y reglas distintas. Lo digital, dependiente de dispositivos para manifestarse, encuentra su opuesto y su sostén en lo terrestre: aquello que puede tocarse, sentirse y recorrerse en su irregularidad. De esta colisión surgen nuestras propias lógicas de impacto, un marco conceptual que articula la esencia de este drop colectivo.",
            "Maskay Community, desde el norte de Argentina, y Música W3, desde Buenos Aires, se reúnen en una coreografía descentralizada que conecta comunidades. Este impacto se materializa en la intersección entre creadores sonoros y visuales, cuyas colaboraciones surgen desde un anonimato mutuo, permitiendo que la colisión genere nuevas narrativas estéticas.",
            "El resultado: una colección de 11 videoclips que trascienden tanto lo digital como lo terrestre. Estas piezas encuentran sentido en cada transacción, en cada mint. Cada interacción se convierte en una experiencia estética.",
            "Música W3 y Maskay exploran los límites de lo posible en el arte Web3, cuestionando la propia naturaleza de los encuentros creativos y las formas en que el arte se comparte en la era de la descentralización."],
        en:["When digitality collides with rock, earth and territory, different natures and rules emerge. The digital, which depends on devices to manifest itself, finds its opposite and its support in the terrestrial: what can be touched, felt and walked across in all its irregularity. From this collision arise our own logics of impact, a conceptual framework that articulates the essence of this collective drop.",
            "Maskay Community, from northern Argentina, and Música W3, from Buenos Aires, come together in a decentralized choreography that connects communities. This impact takes shape at the intersection between sound and visual creators, whose collaborations arise from mutual anonymity, allowing the collision to generate new aesthetic narratives.",
            "The result: a collection of 11 video clips that go beyond both the digital and the terrestrial. These pieces find meaning in every transaction, in every mint. Each interaction becomes an aesthetic experience.",
            "Música W3 and Maskay explore the limits of what is possible in Web3 art, questioning the very nature of creative encounters and the ways art is shared in the age of decentralization."] } },

    { slug:"busqueda-perderse", year:"2024", featured:true,
      title:{ es:"Búsqueda (hacer arte) / Perderse (en las reglas del mercado)", en:"Búsqueda (hacer arte) / Perderse (en las reglas del mercado) (Searching (Making Art) / Getting Lost (in the Rules of the Market))" },
      date:{ es:"22/11 al 01/12/2024", en:"22 November - 1 December 2024" },
      place:{ es:"5.ª Semana de las Artes Visuales, Casa Museo de la Ciudad, San Miguel de Tucumán", en:"5th Visual Arts Week, Casa Museo de la Ciudad, San Miguel de Tucumán" },
      role:{ es:"MASKAY · Curaduría, montaje y texto curatorial", en:"MASKAY · Curation, installation and curatorial text" },
      desc:{ es:"Exposición de obra física y digital de 18 artistas, articulada en torno a una instalación central con dos pantallas.",
             en:"Exhibition of physical and digital work by 18 artists, organized around a central installation with two screens." },
      quote:{ es:"¿Por qué necesitamos mostrarnos? ¿Qué significa hacer arte en la escena local y luego trascender al ámbito global?",
              en:"Why do we need to show ourselves? What does it mean to make art in the local scene and then reach the global sphere?" },
      text:{
        es:["Durante la Semana de las Artes en Tucumán, la muestra organizada por la comunidad Maskay y curada por Pablo Rivero tuvo lugar en la Casa Museo de la Ciudad en San Miguel de Tucumán. Esta exhibición fusionó arte físico y digital, destacando el potencial transformador de la Web3 para artistas de diversas disciplinas.",
            "El espacio contó con una instalación central compuesta por un soporte estructural con dos pantallas, donde se presentaron obras y procesos creativos de 18 artistas.",
            "En la escena central de la muestra se destacó un concepto fundamental: “Artistas apoyan artistas”. Este espacio buscó derribar barreras geográficas y tecnológicas, fomentando la descentralización y la transparencia genuina.",
            "¿Por qué necesitamos mostrarnos? ¿Qué significa hacer arte en la escena local y luego trascender al ámbito global? ¿Serán celebrados nuestros logros o reconocidos nuestros esfuerzos?",
            "Maskay enfatizó la importancia de la comunidad como refugio, alentando a no perderse en las dinámicas del mercado, o al menos, a no hacerlo en soledad."],
        en:["During Visual Arts Week in Tucumán, the exhibition organized by the Maskay community and curated by Pablo Rivero took place at the Casa Museo de la Ciudad in San Miguel de Tucumán. The exhibition brought together physical and digital art, highlighting the transformative potential of Web3 for artists from different disciplines.",
            "The space featured a central installation made up of a structural support with two screens, where works and creative processes by 18 artists were presented.",
            "At the center of the exhibition stood a fundamental idea: “Artists support artists.” The space sought to break down geographical and technological barriers, encouraging decentralization and genuine transparency.",
            "Why do we need to show ourselves? What does it mean to make art in the local scene and then reach the global sphere? Will our achievements be celebrated, or our efforts recognized?",
            "Maskay stressed the importance of community as a refuge, encouraging us not to get lost in the dynamics of the market, or at least not to do so alone."] } },

    { slug:"hogar-mint-y-temporal", year:"2024", featured:true,
      title:{ es:"Hogar, Mint y Temporal", en:"Hogar, Mint y Temporal (Home, Mint and Storm)" },
      date:{ es:"11 y 12/10/2024", en:"11-12 October 2024" },
      place:{ es:"Festival Tormenta, Festival de Arte Electrónico y Digital, Horco Molle, Tucumán", en:"Festival Tormenta, Electronic and Digital Art Festival, Horco Molle, Tucumán" },
      role:{ es:"MASKAY · Curaduría, montaje y texto curatorial", en:"MASKAY · Curation, installation and curatorial text" },
      desc:null,
      quote:{ es:"¡No tengo internet! ¿Puedo ir a mintear a tu casa?", en:"I've got no internet! Can I come mint at your place?" },
      text:{
        es:["Esta colección de arte digital explora la conexión entre lo cotidiano y lo fantástico, tomando como punto de partida la experiencia creativa desde el hogar en Tucumán. Artistas enfrentan limitaciones tecnológicas de su región mientras proyectan sus sueños, metas e ilusiones a través de un lenguaje visual que fusiona lo tangible con lo onírico.",
            "El hogar es un escenario donde el tiempo fluye entre la calma de la siesta y la intensidad del temporal, momentos que invitan a la introspección. La lluvia, más allá de ser un fenómeno climático, actúa como un detonante de reflexiones sobre logros y desafíos.",
            "Artistas que apoyan artistas. Mi casa es la casa de mis amigos, encuentro a las obras atravesadas por el misticismo de la región…",
            "¡Uy! ¡Se cortó la luz!",
            "¡No tengo internet! ¿Puedo ir a mintear a tu casa?",
            "Amigo, me robaron el celular, creo que voy a tener que trabajar desde tu tablet.",
            "¡Otra vez! Se rompió la compu porque la usamos todos en casa... ¿podrás ayudarme?",
            "Tengo solo un celu, ¡vení a escanear tus dibujos en casa! De aquí hacemos el mint.",
            "Me desaparecí tres meses porque mi compu no soporta programas para dibujar. ¿Alguien me ayuda a crackearlos?"],
        en:["This digital art collection explores the connection between the everyday and the fantastic, taking as its starting point the creative experience of working from home in Tucumán. Artists face the technological limitations of their region while projecting their dreams, goals and hopes through a visual language that merges the tangible with the dreamlike.",
            "Home is a stage where time flows between the calm of the siesta and the intensity of the storm, moments that invite introspection. Rain, beyond being a weather event, acts as a trigger for reflections on achievements and challenges.",
            "Artists who support artists. My house is my friends' house; I find the works crossed by the mysticism of the region…",
            "Oops! The power's out!",
            "I've got no internet! Can I come mint at your place?",
            "Friend, my phone got stolen, I think I'll have to work from your tablet.",
            "Again! The computer broke because we all use it at home... can you help me?",
            "I've only got one phone, come scan your drawings at my place! We'll mint from here.",
            "I disappeared for three months because my computer can't handle drawing programs. Can anyone help me crack them?"] } },

      desc:{ es:"Exhibición de arte digital producido durante la residencia Kismet Casa.", en:"Exhibition of digital art produced during the Kismet Casa residency." },
      quote:null,
      text:{
        es:["Exhibición de arte digital producido durante la residencia Kismet Casa. La curaduría tomó la identidad visual de la residencia para desarrollar un sistema de señalética que funcionó como recorrido y como declaración visual. Cada símbolo, asociado a una idea (viaje, camino, flotar, arte, crear, fluir), orientaba físicamente al visitante y aportaba contexto a las obras. Así, la muestra presentaba en conjunto el trabajo de los artistas, su historia y el viaje compartido durante la residencia."],
        en:["Exhibition of digital art produced during the Kismet Casa residency. The curatorial approach drew on the residency's visual identity to develop a signage system that worked both as a route through the space and as a visual statement. Each symbol, tied to an idea (travel, path, float, art, create, flow), physically guided visitors and gave context to the works. The exhibition thus presented, as a whole, the artists' work, their stories and the journey they shared during the residency."] } },

try { lang = localStorage.getItem("lang") || ((navigator.language || "es").startsWith("en") ? "en" : "es"); } catch(e){}
const open = {};   /* listas desplegadas: { "hinchao-2019": true } */

const t   = v => (v && typeof v === "object" && !Array.isArray(v)) ? (v[lang] ?? v.es) : v;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const href = r => "/" + r;
const path = () => location.pathname.replace(/^\/+|\/+$/g, "");

window.addEventListener("popstate", () => { render(); });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lang]");
  if (b){ lang = lang === "es" ? "en" : "es"; try{ localStorage.setItem("lang", lang); }catch(_){} render(true); return; }
  const tg = e.target.closest("[data-toggle]");
    if (tg){ const k = tg.dataset.toggle; open[k] = !open[k]; render(true); return; }
  const a = e.target.closest('a[href^="/"]');
  if (a && !a.target && !a.hasAttribute("download") && !e.metaKey && !e.ctrlKey && !e.shiftKey){
    e.preventDefault(); history.pushState({}, "", a.getAttribute("href")); render();
  }
});

/* ==========================================================================
   4. PIEZAS
   ========================================================================== */
function media(src, alt, ratio, free){
  return `<div class="m${free ? " m--free" : ""}" style="aspect-ratio:${ratio}">
    <img src="${esc(src)}" alt="${esc(alt)}" loading="lazy"
      onload="this.parentNode.classList.add('ok')" onerror="this.parentNode.classList.add('missing');this.remove()"></div>`;
}
function fig(src, alt, ratio, cap, free){
  return `<figure style="margin:0">${media(src, alt, ratio, free)}${cap ? `<figcaption class="cap"><span>${cap}</span></figcaption>` : ""}</figure>`;
}
function paras(arr, cls){
  const a = t(arr) || [];
  return a.length ? `<div class="${cls || "prose"}">${a.map(p => `<p>${esc(p)}</p>`).join("")}</div>` : "";
}

function squares(){
  const social = SITE.social.map(s =>
    `<a href="${s.href}" target="_blank" rel="me noopener" aria-label="${s.label}"><img src="${ICONS[s.id]}" alt="" width="25" height="25"></a>`).join("");
  const shown = SITE.langShowsCurrent ? lang : (lang === "es" ? "en" : "es");
  const label = lang === "es" ? "Switch to English" : "Cambiar a español";
  return `<div class="squares">${social}<button type="button" data-lang aria-label="${label}" title="${label}">${shown}</button></div>`;
}
function header(active){
  const items = NAV.map(n => {
    const cur = n.id === active ? ' aria-current="page"' : "";
    return `<a href="${href(n.route)}" style="--item:${n.color}"${cur}><span>${esc(t(n.label))}</span></a>`;
  }).join("");
  return `<header class="masthead">
    <a class="brand" href="/">
      <img class="brand__mark" src="${SITE.mark}" alt="Pablo Rivero - Stipinpixel" width="100" height="100">
      <span class="brand__name"><span>pablo rivero</span><span>stipinpixel</span></span>
    </a>
    <nav class="nav" aria-label="${esc(t(UI.sections))}">${items}</nav>
    ${squares()}
  </header>`;
}
function footer(){
  return `<footer class="colophon">${squares()}<p class="colophon__legal">${esc(SITE.legal)}</p></footer>`;
}
function lineBar(current, backTo, backLabel){
  const chips = LINES.map(l => `<a class="chip" href="${href("obra/" + l.slug)}"${l.slug === current ? ' aria-current="page"' : ""}>${esc(t(l.title))}</a>`).join("");
  return `<nav class="bar" aria-label="${esc(t(UI.lines))}"><a class="bar__back" href="${href(backTo)}">← ${esc(backLabel)}</a>${chips}</nav>`;
}
function projectBar(current){
  const chips = PROJECTS.map(p => `<a class="chip" href="${href("proyectos/" + p.slug)}"${p.slug === current ? ' aria-current="page"' : ""}>${esc(p.title)}</a>`).join("");
  return `<nav class="bar" aria-label="${esc(t(NAV[2].label))}"><a class="bar__back" href="${href("proyectos")}">← ${esc(t(NAV[2].label))}</a>${chips}</nav>`;
}

const workImg  = (w, f) => `assets/img/obra/${w.line}/${w.slug}/${f}`;
const lineImg  = l => `assets/img/obra/${l.slug}/portada.jpg`;
const curImg   = c => `assets/img/curaduria/${c.slug}/portada.jpg`;
const projImg  = (p, f) => `assets/img/proyectos/${p.slug}/${f}`;
const resImg   = (r, f) => `assets/img/investigacion/${r.slug}/${f}`;

/* ==========================================================================
   5. VISTAS
   ========================================================================== */
function viewHome(){
  const bands = HOME.map(b => `
    <div class="gap"></div>
    <div class="band band--${b.layout}">
      ${b.tiles.map(x => `<a class="tile tile--${x.size}" href="${href(x.to)}">
          ${media(x.img, t(x.title), "auto")}
          <span class="tile__label">${esc(t(x.title))}</span></a>`).join("")}
    </div>`).join("");
  return { section:"home", title:"Pablo Rivero - Stipinpixel", desc:t(UI.meta),
    html:`<main class="wrap">${bands}<div class="gap"></div></main>` };
}

function viewWorksIndex(){
  const tile = (l, ratio) => `<a class="line" href="${href("obra/" + l.slug)}">${media(lineImg(l), t(l.title), ratio)}<h2 class="line__t">${esc(t(l.title))}</h2></a>`;
  return { section:"works", title:`${t(UI.works)} - Pablo Rivero`, desc:t(UI.meta),
    html:`<main class="wrap">
      <div class="lines" style="grid-template-columns:700fr 295fr">${tile(LINES[0], "700/394")}${tile(LINES[1], "295/394")}</div>
      <div class="lines" style="grid-template-columns:1fr 1fr 1fr">${LINES.slice(2).map(l => tile(l, "4/3")).join("")}</div>
    </main>` };
}

function viewLine(l){
  const items = WORKS.filter(w => w.line === l.slug);
  const cards = items.map(w => `<a class="card" href="${href(`obra/${l.slug}/${w.slug}`)}">
      ${media(workImg(w, "portada.jpg"), t(w.title), "4/3")}
      <div class="card__b"><span class="card__y">${esc(w.year)}</span><p class="card__t">${esc(t(w.title))}</p><p class="card__d">${esc(t(w.tech))}</p></div></a>`).join("");
  const intro = l.intro ? `<div class="prose"><p>${esc(t(l.intro))}</p>${l.see ? `<p style="margin-top:20px"><a class="link" href="${href(l.see.to)}">${esc(t(l.see.label))}</a></p>` : ""}</div>` : "<div></div>";
  return { section:"works", title:`${t(l.title)} - Pablo Rivero`, desc:t(l.intro) || t(UI.meta),
    html:`<main class="wrap">
      ${lineBar(l.slug, "obra", t(UI.works))}
      <div class="lead"><h1 class="h1">${esc(t(l.title))}</h1>${intro}</div>
      <div class="cards">${cards}</div>
    </main>` };
}

function factsHTML(facts, links){
  const rows = (facts || []).map(f => {
    const v = f.list ? `<ul>${f.list.map(x => `<li>${esc(t(x))}</li>`).join("")}</ul>` : esc(t(f.v));
    return `<dt>${esc(t(f.k))}</dt><dd>${v}</dd>`;
  });
  if (links && links.length) rows.push(`<dt>Links</dt><dd>${links.map(k => `<a class="link" href="${k.href}" target="_blank" rel="noopener">${esc(k.label)}</a>`).join("<br>")}</dd>`);
  return rows.join("");
}

function viewWork(l, w){
  const body = (t(w.body) || []).map(p => `<p>${esc(p)}</p>`).join("")
    + (w.bullets ? `<ul class="bul">${w.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : "");
  const gal = (w.gallery || []).map(g => fig(workImg(w, g.file), t(w.title), g.ratio || "4/3", g.cap ? esc(t(g.cap)) : "")).join("");
  return { section:"works", title:`${t(w.title)} - Pablo Rivero`, desc:(t(w.body) || [])[0] || t(w.tech),
    html:`<main class="wrap">
      ${lineBar(l.slug, "obra/" + l.slug, t(UI.back))}
      <div class="ftitle"><h1 class="h1 h1--xl">${esc(t(w.title))}</h1><span class="ftitle__y">${esc(w.year)}</span></div>
      ${fig(workImg(w, "portada.jpg"), t(w.title), "16/9", w.coverCap ? esc(t(w.coverCap)) : "", true)}
      <div class="fhead">
        <div class="prose">${body || `<p>${esc(t(w.tech))}</p>`}</div>
        <dl class="sheet"><dt>${lang === "es" ? "Año" : "Year"}</dt><dd>${esc(w.year)}</dd><dt>${lang === "es" ? "Técnica" : "Medium"}</dt><dd>${esc(t(w.tech))}</dd>${factsHTML(w.facts, w.links)}</dl>
      </div>
      ${gal ? `<div class="gal">${gal}</div>` : ""}
    </main>` };
}

function viewCuratorial(){
  const C = CURATORIAL.items;
  const shows = C.filter(c => c.featured).map(c => `
    <article class="show">
      ${fig(curImg(c), t(c.title), "700/394", c.coverCap ? esc(t(c.coverCap)) : "")}
      <div class="show__side">
        <p class="kick">${esc(t(c.date))} · ${esc(t(c.place))}</p>
        <h2 class="show__t"><a href="${href("curaduria/" + c.slug)}">${esc(t(c.title))}</a></h2>
        <p class="show__r">${esc(t(c.role))}</p>
        ${c.quote ? `<p class="quote">“${esc(t(c.quote))}”</p>` : (c.desc ? `<p class="show__r">${esc(t(c.desc))}</p>` : "")}
        <a class="btn" href="${href("curaduria/" + c.slug)}">${esc(t(c.text ? UI.readText : UI.more))} →</a>
      </div>
    </article>`).join("");
  const rest = C.filter(c => !c.featured).map(c =>
    `<li><b>${esc(c.year)}</b><a class="t" href="${href("curaduria/" + c.slug)}">${esc(t(c.title))}</a><span class="v">${esc(t(c.place))}</span></li>`).join("");
  return { section:"curatorial", title:`${t(NAV[1].label)} - Pablo Rivero`, desc:t(CURATORIAL.intro),
    html:`<main class="wrap">
      <div class="lead"><h1 class="h1">${esc(t(NAV[1].label))}</h1><div class="prose"><p>${esc(t(CURATORIAL.intro))}</p></div></div>
      ${shows}
      <div class="block"><h2 class="h2">${esc(t(UI.others))}</h2><ul class="rows">${rest}</ul></div>
      <div class="gap2"></div>
    </main>` };
}

function viewCuratorialItem(c){
  const text = c.text ? `<div class="block"><h2 class="h2">${esc(t(UI.curatorial))}</h2>${paras(c.text, c.poem ? "text text--poem" : "text")}</div>` : "";
  return { section:"curatorial", title:`${t(c.title)} - Pablo Rivero`, desc:t(c.desc) || t(c.place),
    html:`<main class="wrap">
      <nav class="bar"><a class="bar__back" href="${href("curaduria")}">← ${esc(t(NAV[1].label))}</a></nav>
      <div class="ftitle"><h1 class="h1 h1--xl">${esc(t(c.title))}</h1><span class="ftitle__y">${esc(c.year)}</span></div>
      ${fig(curImg(c), t(c.title), "16/9", c.coverCap ? esc(t(c.coverCap)) : "", true)}
      <div class="fhead">
        <div class="prose">${c.desc ? `<p>${esc(t(c.desc))}</p>` : ""}</div>
        <dl class="sheet">
          <dt>${lang === "es" ? "Fecha" : "Date"}</dt><dd>${esc(t(c.date))}</dd>
          <dt>${lang === "es" ? "Lugar" : "Venue"}</dt><dd>${esc(t(c.place))}</dd>
          <dt>${lang === "es" ? "Rol" : "Role"}</dt><dd>${esc(t(c.role))}</dd>
        </dl>
      </div>
      ${text}
      <div class="gap2"></div>
    </main>` };
}

function viewProjects(){
  const cards = PROJECTS.map(p => `<a class="prj" href="${href("proyectos/" + p.slug)}">
      ${media(projImg(p, "portada.jpg"), p.title, "4/3")}
      <h2 class="prj__t">${esc(p.title)}</h2>
      <p class="kick" style="font-size:14px">${esc(t(p.periodLabel))} · ${esc(t(p.role))}</p></a>`).join("");
  return { section:"projects", title:`${t(NAV[2].label)} - Pablo Rivero`, desc:t(UI.meta),
    html:`<main class="wrap"><div class="prjs">${cards}</div></main>` };
}

function eventLi(e){
  return `<li><span class="d">${esc(t(e.d))}</span><span><b>${esc(t(e.t))}</b>${e.x ? " " + esc(t(e.x)) : ""}${e.to ? ` <a class="link" href="${href(e.to)}">→</a>` : ""}</span></li>`;
}
function blockHTML(p, b, i){
  let inner = "";
  if (b.years){
    inner = b.years.map(y => {
      const key = `${p.slug}-${y.y}`;
      const fold = b.fold && y.items.length > b.fold;
      const shown = fold && !open[key] ? y.items.slice(0, 6) : y.items;
      const btn = fold ? `<button type="button" class="toggle" data-toggle="${key}" aria-expanded="${open[key] ? "true" : "false"}">${
        open[key] ? esc(t(UI.showLess)) : esc(t(UI.showAll).replace("{n}", y.items.length).replace("{y}", y.y))}</button>` : "";
      return `<section class="yr"><h3 class="yr__y">${esc(y.y)}</h3><div><ul class="ev">${shown.map(eventLi).join("")}</ul>${btn}</div></section>`;
    }).join("");
  } else if (b.items){
    inner = `<ul class="ev">${b.items.map(e => eventLi({ d:e.d, t:e.t, x:e.x, to:e.to })).join("")}</ul>`;
  } else if (b.paragraphs){
    inner = paras(b.paragraphs);
  } else if (b.links){
    inner = `<p>${b.links.map(k => `<a class="link" href="${k.href}" target="_blank" rel="noopener">${esc(k.label)}</a>`).join(" &nbsp;·&nbsp; ")}</p>`;
  }
  return `<section class="block"><h2 class="h2">${esc(t(b.title))}</h2>${inner}</section>`;
}
function viewProject(p){
  const hl = (p.highlights || []).map(h =>
    fig(projImg(p, h.file), t(h.t), "4/3", `<b>${esc(t(h.t))}</b>, ${esc(t(h.cap))}`)).join("");
  return { section:"projects", title:`${p.title} - Pablo Rivero`, desc:(t(p.intro) || [])[0],
    html:`<main class="wrap">
      ${projectBar(p.slug)}
      <div class="phero">
        <div><h1 class="phero__t">${esc(p.title)}</h1><p class="kick">${esc(t(p.periodLabel))} · ${esc(t(p.role))}</p></div>
        <div class="prose">${(t(p.intro) || []).map(x => `<p>${esc(x)}</p>`).join("")}
          ${p.note ? `<p class="note">${esc(t(p.note))}</p>` : ""}
          ${p.see ? `<p><a class="link" href="${href(p.see.to)}">${esc(t(p.see.label))}</a></p>` : ""}</div>
      </div>
      ${hl ? `<section class="block" style="padding-top:0"><h2 class="h2">${esc(t(UI.highlights))}</h2><div class="hl" style="padding-top:0">${hl}</div></section>` : ""}
      ${(p.blocks || []).map((b, i) => blockHTML(p, b, i)).join("")}
      <div class="gap2"></div>
    </main>` };
}

function viewResearch(){
  const entries = RESEARCH.entries.map(r => {
    const imgs = (r.images || []).map(im => fig(resImg(r, im.file), t(r.title), im.ratio || "4/3", im.cap ? esc(t(im.cap)) : ""));
    return `<article class="entry">
      <div><p class="kick">${esc(r.year)}</p><h3 class="entry__t">${esc(t(r.title))}</h3>
        ${paras(r.body)}${r.see ? `<p style="margin-top:14px"><a class="link" href="${href(r.see.to)}">${esc(t(r.see.label))} →</a></p>` : ""}</div>
      <div${imgs.length > 1 ? ' class="duo"' : ""}>${imgs.join("")}</div>
    </article>`;
  }).join("");
  return { section:"research", title:`${t(NAV[3].label)} - Pablo Rivero`, desc:(t(RESEARCH.intro) || [])[0],
    html:`<main class="wrap">
      <div class="rtop"><div><p class="kick">${esc(t(RESEARCH.kicker))}</p><h1 class="h1" style="margin-top:12px">${esc(t(RESEARCH.title))}</h1></div>${paras(RESEARCH.intro)}</div>
      <section class="block" style="padding-top:0"><h2 class="h2">${esc(t(UI.research))}</h2>${entries}</section>
    </main>` };
}

function viewInfo(active){
  const cv = INFO.cv.map(g => `<section><h2 class="h2">${esc(t(g.title))}</h2><ul class="cvl">${
    g.items.map(i => `<li><b>${esc(t(i.y))}</b><span>${esc(t(i.t))}</span></li>`).join("")}</ul></section>`).join("");
  return { section:active, title:`${t(active === "contact" ? NAV[5].label : NAV[4].label)} - Pablo Rivero`, desc:(t(INFO.bio) || [])[0],
    html:`<main class="wrap">
      <div class="bio">
        <div><h1 class="h1">Pablo Rivero</h1>${paras(INFO.bio)}
          <p style="margin-top:var(--u)"><a class="btn" href="${t(SITE.cv)}" download>${esc(t(UI.cvDownload))} ↓</a></p></div>
        ${fig("assets/img/info/retrato.jpg", "Pablo Rivero", "3/4", "")}
      </div>
      <div class="cv">${cv}</div>
      <section class="contact" id="contacto">
        <h2 class="h1">${esc(t(UI.contact))}</h2>
        <div style="display:flex;flex-direction:column"><a class="mail" href="mailto:${SITE.email}">${SITE.email}</a><p>${esc(t(UI.location))}</p></div>
      </section>
    </main>` };
}

function viewContact(){
  const social = SITE.social.map(s =>
    `<li><a class="link" href="${s.href}" target="_blank" rel="me noopener">${esc(s.label)}</a></li>`).join("");
  return { section:"contact", title:`${t(NAV[5].label)} - Pablo Rivero`, desc:SITE.email,
    html:`<main class="wrap">
      <section class="contact" style="padding-top:var(--u)">
        <h1 class="h1">${esc(t(UI.contact))}</h1>
        <div style="display:flex;flex-direction:column;gap:37.5px">
          <div style="display:flex;flex-direction:column">
            <a class="mail" href="mailto:${SITE.email}">${SITE.email}</a>
            <p>${esc(t(UI.location))}</p>
          
      </section>
      <div class="gap2"></div>
    </main>` };
}

function view404(){
  return { section:"home", title:"404 - Pablo Rivero", desc:"",
    html:`<main class="wrap"><div class="err">
      <img class="err__yukk" src="assets/img/yukk.gif" alt="Yukk" width="240" height="360">
      <p class="err__n">404</p><span class="err__tag">error</span>
      <p class="err__msg">${esc(t(UI.e404))}</p>
      <a class="btn" href="/">${esc(t(UI.goHome))}</a>
    </div></main>` };
}

function resolve(){
  const p = path().split("/").filter(Boolean);
  if (!p.length) return viewHome();
  const [a, b, c] = p;
  if (a === "obra"){
    if (!b) return viewWorksIndex();
    const l = LINES.find(x => x.slug === b); if (!l) return view404();
    if (!c) return viewLine(l);
    const w = WORKS.find(x => x.line === b && x.slug === c);
    return w ? viewWork(l, w) : view404();
  }
  if (a === "curaduria"){
    if (!b) return viewCuratorial();
    const it = CURATORIAL.items.find(x => x.slug === b);
    return it ? viewCuratorialItem(it) : view404();
  }
  if (a === "proyectos"){
    if (!b) return viewProjects();
    const pr = PROJECTS.find(x => x.slug === b);
    return pr ? viewProject(pr) : view404();
  }
  if (a === "investigacion" && !b) return viewResearch();
  if (a === "info" && !b) return viewInfo("info");
  if (a === "contacto" && !b) return viewContact();
  return view404();
}

let last = null;
function render(keepScroll){
  const y = window.scrollY;
  const v = resolve();
  document.body.dataset.section = v.section;
  document.documentElement.lang = lang;
  document.title = v.title;
  const m = document.querySelector('meta[name="description"]');
  if (m) m.setAttribute("content", v.desc || t(UI.meta));
  app.innerHTML = header(v.section) + v.html + footer();
  const now = path();
  if (keepScroll) window.scrollTo(0, y);
  
  else if (now !== last) window.scrollTo(0, 0);
  last = now;
}
(function(){
  const q = new URLSearchParams(location.search).get("p");
  if (q) history.replaceState({}, "", q);
  else if (location.hash.indexOf("#/") === 0) history.replaceState({}, "", location.hash.slice(1));
})();
render();
</script>
